name: Northwing Stable Release

on:
  push:
    tags: ["northwing-v*"]

permissions:
  contents: read

concurrency:
  group: northwing-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, sign, and publish Northwing stable release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate stable tag, product version, and ancestry
        id: version
        shell: pwsh
        env:
          NORTHWING_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = ./scripts/resolve-northwing-release-version.ps1 -Tag $env:NORTHWING_RELEASE_TAG -WailsConfig ./desktop/wails.json
          git fetch origin main-v2
          if ($LASTEXITCODE -ne 0) { throw "could not fetch origin/main-v2" }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main-v2
          if ($LASTEXITCODE -ne 0) { throw "tagged commit is not contained in origin/main-v2" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.26.5
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install frontend
        working-directory: desktop/frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: desktop/frontend
        run: pnpm exec playwright install chromium

      - name: Test root Go modules
        run: go test ./...

      - name: Test desktop Go modules
        working-directory: desktop
        run: go test ./...

      - name: Typecheck frontend
        working-directory: desktop/frontend
        run: pnpm typecheck

      - name: Test frontend
        working-directory: desktop/frontend
        run: pnpm test

      - name: Build production frontend
        working-directory: desktop/frontend
        run: pnpm build

      - name: Test production entry in browser
        working-directory: desktop/frontend
        run: pnpm test:e2e

      - name: Install Wails and pinned NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          ./scripts/install-nsis.ps1

      - name: Verify clean release checkout
        shell: pwsh
        run: ./scripts/assert-northwing-release-checkout-clean.ps1 -RepositoryRoot .

      - name: Build Northwing Windows x64
        working-directory: desktop
        shell: pwsh
        env:
          NORTHWING_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: wails build -platform windows/amd64 -clean -ldflags "-X main.version=$env:NORTHWING_RELEASE_VERSION -X main.channel=stable"

      - name: Restore tracked frontend dist placeholder
        shell: pwsh
        run: git restore --source=HEAD --worktree -- desktop/frontend/dist/.gitkeep

      - name: Verify build output did not modify source checkout
        shell: pwsh
        run: ./scripts/assert-northwing-release-checkout-clean.ps1 -RepositoryRoot .

      - name: Build Northwing update helper
        shell: pwsh
        run: go build -trimpath -ldflags "-s -w" -o desktop/build/bin/northwing-update-helper.exe ./cmd/northwing-update-helper

      - name: Test signing credential validation
        shell: pwsh
        run: ./scripts/test-northwing-release-credential.ps1

      - name: Test Defender scan result classification
        shell: pwsh
        run: ./scripts/test-northwing-defender-scan-result.ps1

      - name: Sign and formally verify Windows release
        shell: pwsh
        env:
          NORTHWING_WINDOWS_RELEASE_CREDENTIAL: ${{ secrets.NORTHWING_WINDOWS_RELEASE_CREDENTIAL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NORTHWING_WINDOWS_RELEASE_CREDENTIAL)) {
            throw "NORTHWING_WINDOWS_RELEASE_CREDENTIAL is required for stable release"
          }
          try {
            ./scripts/sign-northwing-release.ps1 -PrepareCredential -RunnerTemp $env:RUNNER_TEMP
            ./scripts/sign-northwing-release.ps1 -SignPayload -Version ${{ steps.version.outputs.version }} -ArtifactDir ./desktop/build/bin
            ./scripts/smoke-northwing-native-window.ps1 -ExePath ./desktop/build/bin/northwing.exe -EvidencePath ./dist/Northwing-${{ steps.version.outputs.version }}-native-smoke.json -ScreenshotPath ./dist/Northwing-${{ steps.version.outputs.version }}-native-home-1240x720.png -RequireInteractiveWindow
            ./scripts/package-northwing-windows.ps1 -Version ${{ steps.version.outputs.version }} -ExpectedSignerSPKIBase64 $env:NORTHWING_MANIFEST_SPKI_BASE64
            ./scripts/sign-northwing-release.ps1 -SignSetup -Version ${{ steps.version.outputs.version }} -ArtifactDir ./dist
            ./scripts/package-northwing-windows.ps1 -Version ${{ steps.version.outputs.version }} -FinalizeChecksums
            ./scripts/sign-northwing-manifest.ps1 -Version ${{ steps.version.outputs.version }} -ArtifactDir ./dist -Repository ${{ github.repository }}
            ./scripts/verify-northwing-windows.ps1 -Version ${{ steps.version.outputs.version }} -Repository ${{ github.repository }} -ExpectedSignerSPKIBase64 $env:NORTHWING_MANIFEST_SPKI_BASE64
          } finally {
            ./scripts/sign-northwing-release.ps1 -CleanupCredential -RunnerTemp $env:RUNNER_TEMP
          }

      - name: Upload native Windows smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Northwing-${{ steps.version.outputs.version }}-native-smoke
          path: |
            dist/Northwing-${{ steps.version.outputs.version }}-native-smoke.json
            dist/Northwing-${{ steps.version.outputs.version }}-native-home-1240x720.png
          if-no-files-found: warn
          retention-days: 90

      - name: Scan setup and executables with Microsoft Defender
        shell: pwsh
        run: ./scripts/scan-northwing-windows-defender.ps1 -Version ${{ steps.version.outputs.version }} -RequireScanner

      - name: Upload Defender evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Northwing-${{ steps.version.outputs.version }}-defender-scan
          path: dist/Northwing-${{ steps.version.outputs.version }}-defender-scan.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: Northwing ${{ steps.version.outputs.version }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body_path: docs/NORTHWING_RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/Northwing-${{ steps.version.outputs.version }}-windows-x64-setup.exe
            dist/Northwing-${{ steps.version.outputs.version }}-windows-x64-portable.zip
            dist/Northwing-${{ steps.version.outputs.version }}-SHA256SUMS.txt
            dist/Northwing-${{ steps.version.outputs.version }}-defender-scan.json
            dist/northwing-update.json
            dist/northwing-update.json.sig
