name: Northwing Frontend Diagnostics

on:
  push:
    branches:
      - agent/northwing-cowork-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: northwing-frontend-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml
      - name: Install frontend
        working-directory: desktop/frontend
        run: pnpm install --frozen-lockfile
      - name: Run tests and capture log
        id: tests
        working-directory: desktop/frontend
        shell: bash
        run: |
          set +e
          pnpm test 2>&1 | tee "$RUNNER_TEMP/frontend-test.log"
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Extract concise diagnostic
        shell: bash
        run: |
          {
            echo "exit_code=${{ steps.tests.outputs.exit_code }}"
            echo "--- failure lines ---"
            grep -nE 'FAIL|failed|expected|got|Error:|ELIFECYCLE' "$RUNNER_TEMP/frontend-test.log" | tail -n 160 || true
            echo "--- final 240 lines ---"
            tail -n 240 "$RUNNER_TEMP/frontend-test.log"
          } > "$RUNNER_TEMP/frontend-diagnostic.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: northwing-frontend-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/frontend-diagnostic.txt
          if-no-files-found: error
          retention-days: 1
      - name: Preserve test result
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
