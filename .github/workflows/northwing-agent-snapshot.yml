name: Northwing Agent Snapshot

on:
  pull_request:
    branches:
      - main-v2
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.head_ref == 'agent/northwing-0.2-native-work-independent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Archive source tree
        shell: bash
        run: git archive --format=zip --output=northwing-source.zip HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: northwing-agent-source-${{ github.event.pull_request.head.sha }}
          path: northwing-source.zip
          if-no-files-found: error
          retention-days: 1
