name: Northwing Desktop Tidy Export

on:
  push:
    branches:
      - agent/northwing-cowork-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: northwing-tidy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tidy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/northwing-cowork-foundation
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - name: Tidy desktop module
        working-directory: desktop
        run: go mod tidy
      - name: Commit generated module files
        shell: bash
        run: |
          if git diff --quiet -- desktop/go.mod desktop/go.sum; then
            echo "desktop module files are already tidy"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/go.mod desktop/go.sum
          git commit -m "chore(desktop): tidy module dependencies"
          git push origin HEAD:agent/northwing-cowork-foundation
