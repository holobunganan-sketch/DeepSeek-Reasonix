name: Northwing Brand Contract Fix

on:
  push:
    branches:
      - agent/northwing-cowork-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: northwing-brand-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/northwing-cowork-foundation
      - name: Update the product-visible live-region expectation
        shell: python
        run: |
          from pathlib import Path
          path = Path('desktop/frontend/src/__tests__/composer-run-strip.test.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'eq(live?.textContent, "Reasonix is working", "live region announces the stable state text only");'
          new = 'eq(live?.textContent, "Northwing is working", "live region announces the stable Northwing state text only");'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one old assertion, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit the focused test fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/frontend/src/__tests__/composer-run-strip.test.tsx
          git commit -m "test(ui): expect Northwing in live status announcement"
          git push origin HEAD:agent/northwing-cowork-foundation
