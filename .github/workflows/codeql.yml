name: CodeQL

on:
  # Docs/release-notes/root-Markdown changes carry no analyzable code; the
  # weekly cron keeps the full scan cadence regardless.
  push:
    branches: ["main-v2"]
    paths-ignore:
      - 'docs/**'
      - 'release-notes/**'
      - '*.md'
  pull_request:
    branches: ["main-v2"]
    paths-ignore:
      - 'docs/**'
      - 'release-notes/**'
      - '*.md'
  schedule:
    - cron: "27 3 * * 1"

jobs:
  apply-northwing-implementation:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/northwing-0.2-native-work-independent'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate, apply, and clean Northwing implementation
        shell: bash
        env:
          BASE_SHA: b1f9471da9b7bceb0566f46f45d695c8fc9bae34
          TARGET_BRANCH: agent/northwing-0.2-native-work-independent
          EXPECTED_SHA: 9a331c730bc22dfc0d621db13fe81697ab4d25f874329561a142f48485d81770
        run: |
          set -euo pipefail
          head -c 7000 .northwing-agent/change.patch.b64.part-000 > /tmp/part-000
          head -c 7000 .northwing-agent/change.patch.b64.part-001 > /tmp/part-001
          head -c 7000 .northwing-agent/change.patch.b64.part-002 > /tmp/part-002
          head -c 7000 .northwing-agent/change.patch.b64.part-003 > /tmp/part-003
          cat .northwing-agent/change.patch.b64.part-004 .northwing-agent/change.patch.b64.part-004-tail > /tmp/part-004
          head -c 7000 .northwing-agent/change.patch.b64.part-005 > /tmp/part-005
          head -c 2528 .northwing-agent/change.patch.b64.part-006 > /tmp/part-006
          sha256sum /tmp/part-*
          cat /tmp/part-000 /tmp/part-001 /tmp/part-002 /tmp/part-003 /tmp/part-004 /tmp/part-005 /tmp/part-006 > /tmp/northwing-change.patch.b64
          test "$(wc -c < /tmp/northwing-change.patch.b64)" -eq 44528
          actual_sha="$(sha256sum /tmp/northwing-change.patch.b64 | awk '{ print $1 }')"
          echo "expected_sha=$EXPECTED_SHA"
          echo "actual_sha=$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
          base64 -d /tmp/northwing-change.patch.b64 > /tmp/northwing-change.patch.gz
          gzip -t /tmp/northwing-change.patch.gz
          gzip -d -c /tmp/northwing-change.patch.gz > /tmp/northwing-change.patch
          git config user.name "Northwing Agent"
          git config user.email "northwing-agent@users.noreply.github.com"
          git am --3way /tmp/northwing-change.patch
          git show "$BASE_SHA":.github/workflows/codeql.yml > .github/workflows/codeql.yml
          git rm -r --ignore-unmatch .northwing-agent
          git add .github/workflows/codeql.yml
          git commit --amend --no-edit
          git diff --check "$BASE_SHA" HEAD
          git push origin "HEAD:$TARGET_BRANCH"

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
