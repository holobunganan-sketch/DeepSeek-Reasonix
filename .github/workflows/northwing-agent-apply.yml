name: Northwing Agent Apply

on:
  pull_request:
    branches:
      - main-v2
    types: [opened, synchronize, reopened]
    paths:
      - .northwing-agent/change.ready

permissions:
  contents: write

concurrency:
  group: northwing-agent-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/northwing-0.2-native-work-independent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test -s .northwing-agent/change.ready
          parts=(.northwing-agent/change.patch.b64.part-*)
          test -e "${parts[0]}"
          cat "${parts[@]}" | base64 -d | gzip -d > /tmp/northwing-change.patch
          git config user.name "Northwing Agent"
          git config user.email "northwing-agent@users.noreply.github.com"
          git am --3way /tmp/northwing-change.patch
          git rm .northwing-agent/change.ready "${parts[@]}"
          git commit --amend --no-edit
          git push origin HEAD:agent/northwing-0.2-native-work-independent
