name: Northwing Release

on:
  push:
    tags: ["northwing-v*"]

permissions:
  contents: read

concurrency:
  group: northwing-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish unsigned Northwing release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate stable tag, product version, and ancestry
        id: version
        shell: pwsh
        env:
          NORTHWING_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:NORTHWING_RELEASE_TAG
          $version = ./scripts/resolve-northwing-release-version.ps1 -Tag $tag -WailsConfig ./desktop/wails.json
          git fetch origin main-v2
          if ($LASTEXITCODE -ne 0) { throw "could not fetch origin/main-v2" }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main-v2
          if ($LASTEXITCODE -ne 0) { throw "tagged commit is not contained in origin/main-v2" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.26.5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install frontend
        working-directory: desktop/frontend
        run: pnpm install --frozen-lockfile

      - name: Install Wails and NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          ./scripts/install-nsis.ps1

      - name: Verify clean build checkout
        shell: pwsh
        run: ./scripts/assert-northwing-release-checkout-clean.ps1 -RepositoryRoot .

      - name: Build Northwing Windows x64
        working-directory: desktop
        shell: pwsh
        env:
          NORTHWING_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: wails build -platform windows/amd64 -clean -ldflags "-X main.version=$env:NORTHWING_RELEASE_VERSION -X main.channel=stable"

      - name: Verify build output did not modify source checkout
        shell: pwsh
        run: ./scripts/assert-northwing-release-checkout-clean.ps1 -RepositoryRoot .

      - name: Build Northwing update helper
        shell: pwsh
        run: go build -trimpath -ldflags "-s -w" -o desktop/build/bin/northwing-update-helper.exe ./cmd/northwing-update-helper

      - name: Package unsigned installer and portable build
        shell: pwsh
        run: ./scripts/package-northwing-windows.ps1 -Version ${{ steps.version.outputs.version }} -UnsignedTestArtifact

      - name: Verify unsigned Windows installer and portable build
        shell: pwsh
        run: ./scripts/verify-northwing-windows.ps1 -Version ${{ steps.version.outputs.version }} -AllowUnsignedTestArtifact

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: Northwing ${{ steps.version.outputs.version }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body_path: docs/NORTHWING_RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/Northwing-${{ steps.version.outputs.version }}-windows-x64-setup.exe
            dist/Northwing-${{ steps.version.outputs.version }}-windows-x64-portable.zip
            dist/Northwing-${{ steps.version.outputs.version }}-SHA256SUMS.txt
