name: Northwing MCP Brand Fix

on:
  push:
    branches:
      - agent/northwing-cowork-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: northwing-mcp-brand-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/northwing-cowork-foundation
      - name: Update the product-visible MCP expectation
        shell: python
        run: |
          from pathlib import Path
          path = Path('desktop/frontend/src/__tests__/capabilities-panel-actions.test.ts')
          text = path.read_text(encoding='utf-8')
          old = 'Install once and use automatically in every Reasonix project.'
          new = 'Install once and use automatically in every Northwing project.'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one old assertion, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit focused test fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/frontend/src/__tests__/capabilities-panel-actions.test.ts
          git commit -m "test(ui): expect Northwing in MCP scope copy"
          git push origin HEAD:agent/northwing-cowork-foundation
