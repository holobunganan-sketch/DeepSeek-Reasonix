name: Northwing CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main-v2]
  push:
    branches:
      - agent/northwing-cowork-foundation
      - northwing-main

permissions:
  contents: read

concurrency:
  group: northwing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel-and-frontend:
    name: Kernel and frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Go format
        shell: bash
        run: |
          targets=(
            internal/office
            internal/cowork
            internal/tool/builtin
            internal/agent
            cmd/northwing
            cmd/northwing-icon
            desktop/cowork_projects.go
            desktop/cowork_office.go
            desktop/northwing_identity.go
            desktop/northwing_protocol.go
            desktop/northwing_cli.go
            desktop/northwing_updater.go
            desktop/single_instance.go
            desktop/main.go
            desktop/menu.go
            desktop/tray.go
          )
          gofmt -w "${targets[@]}"
          git diff -- "${targets[@]}"
          git diff --exit-code -- "${targets[@]}"

      - name: Kernel tests
        run: go test ./...

      - name: Generate Office interoperability fixtures
        env:
          NORTHWING_OFFICE_FIXTURE_DIR: ${{ runner.temp }}/northwing-office
        run: go test ./internal/office -run TestWriteExternalFixtures -count=1

      - name: Verify Office fixtures with independent parsers
        env:
          NORTHWING_OFFICE_FIXTURE_DIR: ${{ runner.temp }}/northwing-office
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            python-docx==1.2.0 \
            python-pptx==1.0.2 \
            openpyxl==3.1.5 \
            pypdf==5.9.0
          python scripts/verify_northwing_office.py "$NORTHWING_OFFICE_FIXTURE_DIR"

      - name: Frontend install
        working-directory: desktop/frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        working-directory: desktop/frontend
        run: pnpm typecheck

      - name: Frontend tests
        working-directory: desktop/frontend
        run: pnpm test

      - name: Frontend build
        working-directory: desktop/frontend
        run: pnpm build

  desktop-tidy-export:
    name: Desktop module tidy export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: Tidy desktop module
        working-directory: desktop
        run: go mod tidy

      - uses: actions/upload-artifact@v4
        with:
          name: northwing-desktop-tidy-${{ github.sha }}
          path: |
            desktop/go.mod
            desktop/go.sum
          if-no-files-found: error
          retention-days: 1

  windows-desktop:
    name: Windows desktop and packages
    runs-on: windows-latest
    needs: kernel-and-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install frontend
        working-directory: desktop/frontend
        run: pnpm install --frozen-lockfile

      - name: Desktop tests
        working-directory: desktop
        run: go test ./...

      - name: Generate Northwing icons
        run: go run ./cmd/northwing-icon -root .

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build Northwing Windows x64
        working-directory: desktop
        run: wails build -platform windows/amd64 -clean -ldflags "-X main.version=0.1.0 -X main.channel=preview"

      - name: Verify unified Northwing CLI
        shell: pwsh
        run: |
          $output = & .\desktop\build\bin\northwing.exe version 2>&1
          if ($LASTEXITCODE -ne 0) { throw "northwing.exe version exited $LASTEXITCODE`n$output" }
          $text = $output -join "`n"
          if ($text -notmatch "northwing 0\.1\.0") { throw "unexpected CLI output: $text" }

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Package installer and portable build
        shell: pwsh
        run: ./scripts/package-northwing-windows.ps1 -Version 0.1.0

      - uses: actions/upload-artifact@v4
        with:
          name: Northwing-0.1.0-windows-x64
          path: |
            dist/Northwing-0.1.0-windows-x64-setup.exe
            dist/Northwing-0.1.0-windows-x64-portable.zip
            dist/Northwing-0.1.0-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
