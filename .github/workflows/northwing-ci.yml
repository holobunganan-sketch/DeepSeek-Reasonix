name: Northwing CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main-v2]
  push:
    branches:
      - agent/northwing-cowork-foundation
      - northwing-main

permissions:
  contents: read

concurrency:
  group: northwing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel-and-frontend:
    name: Kernel and frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Go format
        shell: bash
        run: |
          files=$(gofmt -l internal/office internal/cowork internal/tool/builtin internal/agent cmd/northwing)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Kernel tests
        run: go test ./...

      - name: Frontend install
        working-directory: desktop/frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        working-directory: desktop/frontend
        run: pnpm typecheck

      - name: Frontend tests
        working-directory: desktop/frontend
        run: pnpm test

      - name: Frontend build
        working-directory: desktop/frontend
        run: pnpm build

  windows-desktop:
    name: Windows desktop and packages
    runs-on: windows-latest
    needs: kernel-and-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install frontend
        working-directory: desktop/frontend
        run: pnpm install --frozen-lockfile

      - name: Desktop tests
        working-directory: desktop
        run: go test ./...

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build Northwing Windows x64
        working-directory: desktop
        run: wails build -platform windows/amd64 -clean -ldflags "-X main.version=0.1.0 -X main.channel=preview"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Package installer and portable build
        shell: pwsh
        run: ./scripts/package-northwing-windows.ps1 -Version 0.1.0

      - uses: actions/upload-artifact@v4
        with:
          name: Northwing-0.1.0-windows-x64
          path: |
            dist/Northwing-0.1.0-windows-x64-setup.exe
            dist/Northwing-0.1.0-windows-x64-portable.zip
            dist/Northwing-0.1.0-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
