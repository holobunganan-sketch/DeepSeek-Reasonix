name: Northwing Release
# UNSIGNED-TEST-ONLY artifacts are deliberately confined to northwing-ci.yml.

on:
  push:
    tags: ["northwing-v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Build and publish signed Northwing Windows release
    runs-on: windows-latest
    environment: northwing-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate stable tag, product version, and ancestry
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^northwing-v(?<version>[0-9]+\.[0-9]+\.[0-9]+)$') { throw "Northwing release tag must be stable" }
          $version = $Matches.version
          $product = & ./scripts/resolve-northwing-product-version.ps1 -WailsConfig ./desktop/wails.json
          if ($product -ne $version) { throw "tag version $version does not match product version $product" }
          git fetch origin main-v2
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main-v2
          if ($LASTEXITCODE -ne 0) { throw "tagged commit is not contained in origin/main-v2" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare and validate release credential
        shell: pwsh
        env:
          NORTHWING_WINDOWS_RELEASE_CREDENTIAL: ${{ secrets.NORTHWING_WINDOWS_RELEASE_CREDENTIAL }}
        run: ./scripts/sign-northwing-release.ps1 -PrepareCredential -RunnerTemp $env:RUNNER_TEMP

      - name: Install frontend
        working-directory: desktop/frontend
        run: pnpm install --frozen-lockfile
      - name: Install Wails and NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          ./scripts/install-nsis.ps1
      - name: Build Northwing Windows x64
        working-directory: desktop
        shell: pwsh
        run: |
          wails build -platform windows/amd64 -clean -ldflags "-X main.version=${{ steps.version.outputs.version }} -X main.channel=stable -X main.northwingManifestPublicKeySPKIBase64=$env:NORTHWING_MANIFEST_SPKI_BASE64"

      - name: Sign and verify payload binaries
        shell: pwsh
        run: ./scripts/sign-northwing-release.ps1 -SignPayload -Version '${{ steps.version.outputs.version }}' -ArtifactDir desktop/build/bin
      - name: Package signed Northwing artifacts
        shell: pwsh
        run: ./scripts/package-northwing-windows.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Sign and verify setup
        shell: pwsh
        run: ./scripts/sign-northwing-release.ps1 -SignSetup -Version '${{ steps.version.outputs.version }}' -ArtifactDir dist
      - name: Generate final checksums
        shell: pwsh
        run: ./scripts/package-northwing-windows.ps1 -Version '${{ steps.version.outputs.version }}' -FinalizeChecksums
      - name: Sign and verify Northwing update manifest
        shell: pwsh
        run: ./scripts/sign-northwing-manifest.ps1 -Version '${{ steps.version.outputs.version }}' -ArtifactDir dist -Repository '${{ github.repository }}'
      - name: Verify signed Windows release
        shell: pwsh
        run: ./scripts/verify-northwing-windows.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Northwing-${{ steps.version.outputs.version }}-windows-x64-setup.exe
            dist/Northwing-${{ steps.version.outputs.version }}-windows-x64-portable.zip
            dist/Northwing-${{ steps.version.outputs.version }}-SHA256SUMS.txt
            dist/northwing-update.json
            dist/northwing-update.json.sig
      - name: Remove release credential material
        if: always()
        shell: pwsh
        run: ./scripts/sign-northwing-release.ps1 -CleanupCredential -RunnerTemp $env:RUNNER_TEMP
